<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>直式乘法看得見</title>
<style>
:root{--bg:#fff;--ink:#111;--soft:#e9e9e9;--mute:#555;--line:#999;--card:#fafafa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--ink:#f2f2f2;--soft:#3a3d44;--mute:#b5b5b5;--line:#777;--card:#1e2126}}
:root[data-theme="dark"]{--bg:#16181c;--ink:#f2f2f2;--soft:#3a3d44;--mute:#b5b5b5;--line:#777;--card:#1e2126}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--card)}
.ctl label{display:flex;flex-direction:column;font-weight:700;font-size:14px}
input[type=number]{width:90px;font:700 22px monospace;padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);color:var(--ink)}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--ink);padding:9px 14px;font:700 15px inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed=true]::before{content:"✓ "}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.nav button{border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;font:700 15px inherit;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.alg{border:2px solid var(--ink);border-radius:10px;padding:10px 14px;margin:8px 0;overflow-x:auto}
.alg table{border-collapse:collapse}
.alg td{padding:1px 6px;white-space:pre}
.alg .n{font:700 26px/1.3 monospace;text-align:right}
.alg .t{font-size:14px;color:var(--mute)}
.alg tr.cur .n{text-decoration:underline;text-decoration-thickness:3px}
.alg tr.cur .t{color:var(--ink);font-weight:700}
.alg tr.rule td{border-top:3px solid var(--ink);padding:0}
.card{border:2px solid var(--ink);border-radius:10px;padding:12px;margin:12px 0;background:var(--card)}
.card h2{font-size:17px;margin:0 0 6px}
.card p{margin:4px 0}
.grps{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.grp{border:2px dashed var(--ink);border-radius:8px;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;max-width:100%}
.grp small{width:100%;font-size:11px;color:var(--mute)}
.pile{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.big{font:700 18px monospace}
.msg{color:var(--mute);padding:8px}
.it{flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--soft);color:var(--ink);font:700 11px monospace}
.m1{width:22px;height:22px;border-radius:50%}
.m10{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--soft),inset 0 0 0 4.5px var(--ink)}
.m100{width:58px;height:28px;border-radius:3px}
.m1000{width:68px;height:32px;border:4px double var(--ink);border-radius:3px}
.b1{width:12px;height:12px;border-width:1.5px}
.b10{width:13px;height:73px;border-width:1.5px;background:repeating-linear-gradient(to bottom,transparent 0 6.2px,var(--ink) 6.2px 7.3px)}
.b100{width:52px;height:52px;border-width:1.5px;background:repeating-linear-gradient(to bottom,transparent 0 4.4px,var(--line) 4.4px 5.2px),repeating-linear-gradient(to right,transparent 0 4.4px,var(--line) 4.4px 5.2px),var(--soft)}
.b1000{width:60px;height:60px;box-shadow:5px -5px 0 0 var(--card),5px -5px 0 2px var(--ink);margin-right:6px}
@media print{.ctl,.nav{display:none}main{max-width:none}}
</style>
</head>
<body>
<main>
<h1>🧮 直式乘法看得見</h1>
<div class="ctl">
  <label>被乘數<input id="a" type="number" inputmode="numeric" min="1" max="999" value="32"></label>
  <label>乘數<input id="b" type="number" inputmode="numeric" min="1" max="9" value="7"></label>
  <div>
    <div style="font-weight:700;font-size:14px">用什麼來表示？</div>
    <div class="seg"><button id="bm" aria-pressed="true">錢幣鈔票</button><button id="bb" aria-pressed="false">積木</button></div>
  </div>
</div>
<div class="nav">
  <button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button><button id="all">全部顯示</button><button id="reset">重來</button>
</div>
<div id="alg"></div>
<div id="cards"></div>
<p class="msg">提示：被乘數可輸入 1 到 999，乘數可輸入 1 到 9。黑白列印時也能分辨：圓形是小面額，長方形是鈔票，每個圖形上都標有數字。</p>
</main>
<script>
var mode='money',step=0,$=function(i){return document.getElementById(i)};
var PN=['個位','十位','百位'];
function mk(c,t){var e=document.createElement('div');e.className=c;if(t!=null)e.textContent=t;return e}
function item(u){
  var e=mk('it '+(mode==='money'?'m':'b')+u);
  if(mode==='money')e.textContent=u;
  else if(u>=100)e.textContent=u;
  return e;
}
function pile(u,c){var p=mk('pile');for(var i=0;i<c;i++)p.appendChild(item(u));return p}
function words(u,c){
  if(mode==='money')return c+(u>=100?' 張 ':' 枚 ')+u+' 元'+(u>=100?'鈔票':'硬幣');
  return c+(u===1?' 個 1 ':u===10?' 條 10 ':u===100?' 片 100 ':' 塊 1000 ')+'積木';
}
function groups(m,list,label){
  var g=mk('grps');
  for(var k=1;k<=m;k++){
    var b=mk('grp');b.appendChild(mk('','')).remove();
    list.forEach(function(x){if(x[1]>0)b.appendChild(pile(x[0],x[1]))});
    var s=document.createElement('small');s.textContent='第 '+k+' 組';b.insertBefore(s,b.firstChild);
    g.appendChild(b);
  }
  return g;
}
function card(title){var c=mk('card');var h=document.createElement('h2');h.textContent=title;c.appendChild(h);return c}
function para(c,t){var p=document.createElement('p');p.textContent=t;c.appendChild(p);return p}
function render(){
  var a=parseInt($('a').value,10),m=parseInt($('b').value,10),A=$('alg'),C=$('cards');
  A.innerHTML='';C.innerHTML='';
  if(!(a>=1&&a<=999&&m>=1&&m<=9)){A.appendChild(mk('msg','請輸入被乘數 1 到 999、乘數 1 到 9。'));return}
  var ds=String(a).split('').reverse().map(Number),n=ds.length,last=n+1;
  if(step>last)step=last;
  $('prev').disabled=step===0;$('next').disabled=step===last;
  var total=a*m,W=String(total).length+2;
  function pad(s){s=String(s);while(s.length<W)s=' '+s;return s}
  // vertical algorithm
  var box=mk('alg'),tb=document.createElement('table');
  function row(num,note,cls){var r=document.createElement('tr');if(cls)r.className=cls;
    var x=document.createElement('td');x.className='n';x.textContent=num;var y=document.createElement('td');y.className='t';y.textContent=note||'';r.appendChild(x);r.appendChild(y);tb.appendChild(r)}
  row(pad(a),'');
  row('×'+pad(m).slice(1),'');
  var rl=document.createElement('tr');rl.className='rule';rl.innerHTML='<td colspan="2"></td>';tb.appendChild(rl);
  for(var i=0;i<n&&i+1<=step;i++){
    var v=ds[i]*m*Math.pow(10,i);
    row(pad(v),(i===step-1?'◀ ':'')+PN[i]+'：'+ds[i]+(i?'0'.repeat(i):'')+' × '+m+' = '+v,i===step-1?'cur':'');
  }
  if(step===last){
    var r2=document.createElement('tr');r2.className='rule';r2.innerHTML='<td colspan="2"></td>';tb.appendChild(r2);
    row(pad(total),'◀ 全部加起來',"cur");
  }
  box.appendChild(tb);A.appendChild(box);
  // cards
  var c0=card('題目：'+m+' 組 '+a);
  var list=[];for(var i=n-1;i>=0;i--)list.push([Math.pow(10,i),ds[i]]);
  para(c0,a+' × '+m+' 的意思是：有 '+m+' 組，每組都是 '+a+'。');
  c0.appendChild(groups(m,list));
  C.appendChild(c0);
  for(var i=0;i<n&&i+1<=step;i++){
    var u=Math.pow(10,i),d=ds[i],c=card('第 '+(i+1)+' 步：先算'+PN[i]+'（'+ds[i]+(i?'0'.repeat(i):'')+' × '+m+'）');
    if(d===0){para(c,PN[i]+'是 0，沒有東西，這一堆是 0。')}
    else{
      para(c,m+' 組，每組有 '+words(u,d)+'。');
      c.appendChild(groups(m,[[u,d]]));
      if(i===0)para(c,'一共 '+d+' × '+m+' = '+d*m+'，所以是 '+d*m+(mode==='money'?' 元':' 個一')+'。直式寫 '+d*m+'。');
      else para(c,'一共 '+d+' × '+m+' = '+d*m+' 個「'+u+'」，每個「'+u+'」是 '+u+'，所以是 '+d*m+' × '+u+' = '+d*m*u+'。直式寫 '+d*m*u+'。');
    }
    C.appendChild(c);
  }
  if(step===last){
    var parts=[];for(var i=0;i<n;i++)parts.push(ds[i]*m*Math.pow(10,i));
    var cf=card('最後一步：把每一堆加起來');
    para(cf,parts.join(' + ')+' = '+total);
    para(cf,'每一個數都是同一批東西的一部分：先分開數（'+parts.join('、')+'），最後要合起來數，所以要相加。');
    para(cf,'換算後（滿 10 個就換成上一級）：');
    var res=[],t=total;[1000,100,10,1].forEach(function(u){var q=Math.floor(t/u);t-=q*u;if(q>0)res.push([u,q])});
    var wrap=mk('grps'),g=mk('grp');res.forEach(function(x){g.appendChild(pile(x[0],x[1]))});wrap.appendChild(g);cf.appendChild(wrap);
    var big=para(cf,a+' × '+m+' = '+total);big.className='big';
    C.appendChild(cf);
  }
}
function reset(){step=0;render()}
$('a').oninput=reset;$('b').oninput=reset;
$('next').onclick=function(){step++;render()};
$('prev').onclick=function(){step--;render()};
$('all').onclick=function(){step=99;render()};
$('reset').onclick=reset;
function setMode(x){mode=x;$('bm').setAttribute('aria-pressed',x==='money');$('bb').setAttribute('aria-pressed',x==='blocks');render()}
$('bm').onclick=function(){setMode('money')};$('bb').onclick=function(){setMode('blocks')};
render();
</script>
</body>
</html>
